<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThreadAtlas</title>
    <style>
      body {
        margin: 0;
        width: 320px;
        padding: 12px;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #0f172a;
        background: #ffffff;
      }

      .title {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 700;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
      }

      .button {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #f8fafc;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }

      .status {
        margin-bottom: 8px;
        font-size: 12px;
        color: #475569;
      }

      .summary {
        margin: 0;
        padding: 10px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #f8fafc;
        font-size: 11px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1 class="title">ThreadAtlas</h1>
    <div class="toolbar">
      <button id="popup-capture-button" class="button" type="button">Capture Snapshot</button>
      <button id="popup-copy-button" class="button" type="button">Copy JSON</button>
      <button id="popup-open-sidepanel-button" class="button" type="button">Open Sidepanel</button>
      <button id="popup-selection-button" class="button" type="button">Selection Off</button>
    </div>
    <div id="popup-status" class="status">No semantic snapshot captured yet.</div>
    <pre id="popup-summary" class="summary"></pre>
    <script src="popup.js"></script>
  </body>
</html>
