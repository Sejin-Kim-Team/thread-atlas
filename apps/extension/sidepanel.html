<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThreadAtlas</title>
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        color: #0f172a;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px solid #e2e8f0;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #64748b;
      }

      .status-label {
        margin-left: 8px;
        font-size: 12px;
        color: #334155;
      }

      .section {
        padding: 12px;
      }

      .toast {
        position: fixed;
        bottom: 8px;
        left: 8px;
        right: 8px;
        background: #0f172a;
        color: white;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12px;
        display: none;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        border-radius: 999px;
        font-size: 12px;
        padding: 6px 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div>ThreadAtlas</div>
      <div style="display: flex; align-items: center">
        <div id="status-dot" class="status-dot"></div>
        <div id="status-label" class="status-label">initializing</div>
      </div>
    </header>
    <section class="section">
      <div id="present-root"></div>
    </section>
    <section class="section">
      <div id="suggest-root" class="chips"></div>
    </section>
    <div id="notify-root" class="toast"></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
