<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThreadAtlas</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f3eb;
        --surface: rgba(255, 255, 255, 0.88);
        --surface-strong: #ffffff;
        --border: rgba(15, 23, 42, 0.09);
        --text: #18212f;
        --muted: #5f6c80;
        --accent: #3f66d6;
        --accent-soft: rgba(63, 102, 214, 0.1);
        --ready: #1f9a6d;
        --warn: #c57b2f;
        --danger: #c84e4e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(63, 102, 214, 0.12), transparent 28%),
          linear-gradient(180deg, #fcfaf5 0%, var(--bg) 52%, #f3eee5 100%);
      }

      .shell {
        position: relative;
        min-height: 100vh;
        padding: 18px 16px 20px;
      }

      .header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .header-copy {
        min-width: 0;
      }

      .page-domain {
        margin: 0 0 6px;
        color: var(--muted);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .page-title {
        margin: 0;
        font-size: 28px;
        line-height: 1.08;
        font-weight: 600;
        letter-spacing: -0.025em;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .readiness-pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        font-weight: 600;
      }

      .readiness-pill[data-state="ready"] {
        color: var(--ready);
      }

      .readiness-pill[data-state="preparing"] {
        color: var(--accent);
      }

      .readiness-pill[data-state="needs-refresh"] {
        color: var(--warn);
      }

      .readiness-pill[data-state="unavailable"] {
        color: var(--danger);
      }

      .icon-button,
      .menu-button,
      .button,
      .action-button {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--surface-strong);
        color: var(--text);
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
      }

      .icon-button,
      .menu-button {
        width: 36px;
        height: 36px;
        font-size: 18px;
        line-height: 1;
      }

      .menu {
        position: absolute;
        top: 68px;
        right: 16px;
        width: 240px;
        padding: 12px;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
        backdrop-filter: blur(14px);
        z-index: 10;
      }

      .menu.hidden,
      .hidden {
        display: none !important;
      }

      .menu-user {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .menu-avatar {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        font-weight: 700;
      }

      .menu-user-name,
      .menu-user-email,
      .menu-help {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .menu-user-name {
        font-size: 13px;
        font-weight: 700;
      }

      .menu-user-email,
      .menu-help {
        font-size: 12px;
        color: var(--muted);
      }

      .menu-actions {
        display: grid;
        gap: 8px;
      }

      .menu-row-button {
        width: 100%;
        text-align: left;
        padding: 10px 12px;
        border-radius: 12px;
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 18px 60px rgba(15, 23, 42, 0.04);
        backdrop-filter: blur(12px);
      }

      .conversation-panel {
        padding: 16px;
      }

      .inline-card {
        margin-bottom: 12px;
        padding: 14px;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.84);
      }

      .inline-card-title {
        margin: 0 0 6px;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        font-weight: 700;
      }

      .inline-card-body {
        margin: 0 0 10px;
        color: var(--muted);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1.45;
      }

      .button {
        padding: 9px 14px;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        font-weight: 600;
      }

      .button-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }

      .signal-wrap {
        margin-bottom: 14px;
      }

      .scope-bar {
        display: grid;
        gap: 8px;
        margin-bottom: 14px;
      }

      .scope-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: fit-content;
        max-width: 100%;
        padding: 7px 11px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.76);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        font-weight: 700;
      }

      .scope-chip[data-scope="selection"] {
        border-color: rgba(63, 102, 214, 0.2);
        background: var(--accent-soft);
        color: var(--accent);
      }

      .scope-clear {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.08);
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
      }

      .scope-preview {
        color: var(--muted);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        line-height: 1.4;
      }

      .scope-meta {
        color: #7f89a4;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 11px;
        line-height: 1.35;
      }

      .signal {
        height: 34px;
        margin-bottom: 6px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.68);
        display: flex;
        align-items: center;
        padding: 0 10px;
      }

      .signal svg {
        width: 100%;
        height: 24px;
      }

      .signal path {
        fill: none;
        stroke: var(--accent);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.86;
      }

      .signal[data-state="thinking"] path {
        animation: pulse-line 1.45s ease-in-out infinite;
      }

      @keyframes pulse-line {
        0%, 100% {
          opacity: 0.35;
        }
        50% {
          opacity: 0.95;
        }
      }

      .activity-label {
        color: var(--muted);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
      }

      .transcript {
        display: grid;
        gap: 12px;
        min-height: 240px;
        margin-bottom: 14px;
      }

      .consumer-empty,
      .consumer-message {
        border-radius: 20px;
        padding: 14px;
      }

      .consumer-empty {
        border: 1px dashed var(--border);
        background: rgba(255, 255, 255, 0.55);
        color: var(--muted);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1.45;
      }

      .consumer-message {
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.74);
      }

      .consumer-message-user {
        background: rgba(63, 102, 214, 0.08);
      }

      .consumer-message-pending {
        opacity: 0.84;
      }

      .consumer-message-role,
      .consumer-message-footer,
      .consumer-provenance,
      .consumer-actions {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .consumer-message-role {
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .consumer-message-text {
        font-size: 18px;
        line-height: 1.52;
        white-space: pre-wrap;
      }

      .consumer-message-footer {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .consumer-provenance {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .consumer-provenance-pill {
        padding: 5px 9px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
      }

      .consumer-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .consumer-action-button {
        padding: 7px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.88);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .composer {
        display: grid;
        gap: 12px;
      }

      .composer-input {
        width: 100%;
        resize: vertical;
        min-height: 96px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.9);
        color: var(--text);
        padding: 14px 16px;
        font: inherit;
        font-size: 17px;
        line-height: 1.5;
      }

      .composer-input:disabled {
        color: #99a3b5;
        background: rgba(255, 255, 255, 0.65);
      }

      .composer-row {
        display: flex;
        gap: 10px;
      }

      .hold-button {
        flex: 0 0 auto;
        min-width: 120px;
        padding: 0 16px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.95);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        font-weight: 700;
      }

      .send-button {
        flex: 0 0 auto;
        min-width: 86px;
      }

      .context-sheet {
        position: fixed;
        inset: 20px 12px 20px 56px;
        z-index: 20;
        padding: 18px;
        border-radius: 24px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.12);
      }

      .context-sheet-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }

      .context-sheet-title {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
      }

      .context-item {
        padding: 12px 0;
        border-top: 1px solid var(--border);
      }

      .context-item:first-child {
        border-top: 0;
      }

      .context-source,
      .context-summary {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .context-source {
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .context-summary {
        font-size: 13px;
        line-height: 1.5;
      }

      .toast {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        border-radius: 14px;
        padding: 12px 14px;
        background: rgba(19, 28, 43, 0.96);
        color: #ffffff;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <div class="header-copy">
          <div id="consumer-page-domain" class="page-domain">Current page</div>
          <h1 id="consumer-page-title" class="page-title">ThreadAtlas</h1>
        </div>
        <div class="header-actions">
          <div id="consumer-readiness-pill" class="readiness-pill" data-state="preparing">Preparing</div>
          <button id="consumer-menu-button" class="menu-button" type="button" aria-label="Open menu">···</button>
        </div>
      </header>

      <div id="consumer-menu" class="menu hidden">
        <div class="menu-user">
          <div id="consumer-menu-avatar" class="menu-avatar">TA</div>
          <div>
            <div id="consumer-menu-name" class="menu-user-name">Signed out</div>
            <div id="consumer-menu-email" class="menu-user-email"></div>
          </div>
        </div>
        <div class="menu-actions">
          <button id="consumer-menu-voice-output" class="menu-row-button" type="button">Voice output on</button>
          <button id="consumer-sign-out-button" class="menu-row-button hidden" type="button">Sign out</button>
          <button id="consumer-open-console-button" class="menu-row-button hidden" type="button">Open internal console</button>
          <div class="menu-help">Hold <strong>Space</strong> to talk. Release to send. Press <strong>Esc</strong> to cancel or clear selection.</div>
        </div>
      </div>

      <section class="panel conversation-panel">
        <div id="consumer-auth-card" class="inline-card hidden">
          <div id="consumer-auth-title" class="inline-card-title">Talk with the page you are reading</div>
          <div id="consumer-auth-body" class="inline-card-body">Sign in once and ask questions about the current page with voice or text.</div>
          <button id="consumer-sign-in-button" class="button button-primary" type="button">Continue with Google</button>
        </div>

        <div id="consumer-recovery-card" class="inline-card hidden">
          <div id="consumer-recovery-title" class="inline-card-title"></div>
          <div id="consumer-recovery-body" class="inline-card-body"></div>
          <button id="consumer-recovery-primary" class="button" type="button">Refresh page</button>
        </div>

        <div class="scope-bar">
          <div id="consumer-scope-chip" class="scope-chip" data-scope="page">
            <span id="consumer-scope-label">This page</span>
            <button
              id="consumer-scope-clear"
              class="scope-clear hidden"
              type="button"
              aria-label="Clear selection scope"
            >
              ×
            </button>
          </div>
          <div id="consumer-scope-preview" class="scope-preview hidden"></div>
          <div id="consumer-scope-meta" class="scope-meta hidden"></div>
        </div>

        <div class="signal-wrap">
          <div id="consumer-signal" class="signal" data-state="idle">
            <svg viewBox="0 0 240 28" preserveAspectRatio="none" aria-hidden="true">
              <path id="consumer-signal-path" d="M 0 14 L 240 14"></path>
            </svg>
          </div>
          <div id="consumer-activity-label" class="activity-label">Hold to talk or type a question.</div>
        </div>

        <div id="consumer-transcript" class="transcript"></div>

        <div class="composer">
          <textarea
            id="conversation-input"
            class="composer-input"
            placeholder="Ask about this page..."
          ></textarea>
          <div class="composer-row">
            <button id="conversation-mic-button" class="hold-button" type="button">Hold to talk</button>
            <button id="conversation-send-button" class="button button-primary send-button" type="button">Send</button>
          </div>
        </div>
      </section>

      <aside id="consumer-context-sheet" class="context-sheet hidden">
        <div class="context-sheet-header">
          <h2 id="consumer-context-title" class="context-sheet-title">More context</h2>
          <button id="consumer-context-close" class="icon-button" type="button" aria-label="Close context sheet">×</button>
        </div>
        <div id="consumer-context-list"></div>
      </aside>

      <div id="notify-root" class="toast"></div>
    </div>
    <script src="sidepanel.js"></script>
  </body>
</html>
